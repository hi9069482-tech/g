<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>PakPattan Services Hub | Find Local Services Near You</title>
    <meta name="description" content="Find trusted plumbers, electricians, carpenters, painters, technicians, restaurants, delivery services and more across Pakpattan, Arifwala and nearby villages." />
    
    <!-- OpenGraph Metadata -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PakPattan Services Hub" />
    <meta property="og:title" content="PakPattan Services Hub | Find Local Services Near You" />
    <meta property="og:description" content="Discover skilled professionals, local businesses, and reliable services in Pakpattan, Arifwala, and nearby villages — all in one place." />
    <meta property="og:image" content="/icon.svg" />
    
    <!-- Twitter Metadata -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PakPattan Services Hub | Find Local Services Near You" />
    <meta name="twitter:description" content="Find trusted plumbers, electricians, carpenters, technicians, and local services in Pakpattan & Arifwala." />
    <meta name="twitter:image" content="/icon.svg" />

    <!-- PWA & Mobile Web Tags -->
    <meta name="theme-color" content="#5865F2" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="PakPattanHub" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Preconnect Google Fonts for High Performance Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800&family=Noto+Nastaliq+Urdu:wght@500;700&display=swap" rel="stylesheet" />

    <!-- Schema.org JSON-LD Structured Data for Local Hyperlocal Marketplace -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "PakPattan Services Hub",
      "alternateName": "پاکپتن سروسز ہب",
      "url": "https://pakpattan-services-hub.pk",
      "description": "Multi-vendor hyperlocal services marketplace connecting customers with verified local service providers in Pakpattan, Arifwala, and surrounding villages.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://pakpattan-services-hub.pk/?search={search_term_string}",
        "query-input": "required name=search_term_string"
      },
      "areaServed": [
        {
          "@type": "AdministrativeArea",
          "name": "Pakpattan"
        },
        {
          "@type": "AdministrativeArea",
          "name": "Arifwala"
        },
        {
          "@type": "AdministrativeArea",
          "name": "Sahiwal Division"
        }
      ]
    }
    </script>
  </head>
  <body class="bg-[#F7F8FC] text-[#111827] antialiased selection:bg-[#5865F2]/20 selection:text-[#111A4A]">
    <div id="root"></div>

  </body>
</html>
