  <path d="M244 245 L252 253 L268 237" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  
  <!-- Star / Quality badge dot -->
  <circle cx="340" cy="150" r="18" fill="#F5A623" />
</svg>
