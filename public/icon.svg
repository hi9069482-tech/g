  <!-- Outer location pin / shelter outline -->
  <path d="M256 70 C160 70 86 144 86 240 C86 330 200 415 242 443 C250 448 262 448 270 443 C312 415 426 330 426 240 C426 144 352 70 256 70 Z" 
